<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Grit Financial Complaint Classification Report.">
  <meta name="theme-color" content="#111111">
  <meta http-equiv="refresh" content="0; url=https://grit-financial.github.io/neil_strategy/projects/complaint-classification.html">
  <link rel="canonical" href="https://grit-financial.github.io/neil_strategy/projects/complaint-classification.html">
  <link rel="icon" type="image/png" href="assets/Grit_FavIcon.png">
  <title>Opening Complaint Classification Report | Grit Financial</title>
  <style>
    :root {
      --ink: #111111;
      --white: #ffffff;
      --magenta: #ff36d7;
      --blue: #3395ff;
      --muted: #686a72;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 54, 215, .15), transparent 32%),
        radial-gradient(circle at 85% 85%, rgba(51, 149, 255, .15), transparent 34%),
        #f7f7f9;
      font-family: "Source Sans 3", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(560px, 100%);
      padding: 34px;
      border: 1px solid #e5e5ea;
      border-radius: 22px;
      background: var(--white);
      box-shadow: 0 24px 70px rgba(17, 17, 17, .12);
      text-align: center;
    }
    .logo { width: 150px; max-width: 55%; height: auto; margin-bottom: 24px; }
    .loader {
      width: 52px;
      height: 52px;
      margin: 0 auto 22px;
      border: 5px solid #ececf1;
      border-top-color: var(--magenta);
      border-right-color: var(--blue);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    h1 { margin: 0 0 12px; font-size: clamp(1.55rem, 4vw, 2.15rem); line-height: 1.1; }
    p { margin: 0; color: var(--muted); line-height: 1.55; }
    .actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
    a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border: 1px solid #d9d9df;
      border-radius: 999px;
      color: var(--ink);
      background: var(--white);
      font-weight: 750;
      text-decoration: none;
    }
    a.primary { border-color: transparent; background: linear-gradient(105deg, var(--magenta), var(--blue)); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .loader { animation: none; } }
  </style>
  <script>
    // Use a top-level redirect instead of an iframe. This avoids the embedded
    // 404/frame-loading behavior that affected the previous project wrapper.
    window.location.replace(
      "https://grit-financial.github.io/neil_strategy/projects/complaint-classification.html"
    );
  </script>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/Grit_Logo_RGB.png" alt="Grit Financial">
    <div class="loader" aria-hidden="true"></div>
    <h1>Opening the Complaint Classification Report</h1>
    <p>You are being taken to the complete interactive report.</p>
    <div class="actions">
      <a class="primary" href="https://grit-financial.github.io/neil_strategy/projects/complaint-classification.html">Open report now</a>
      <a href="index.html">Return to all projects</a>
    </div>
  </main>
</body>
</html>
